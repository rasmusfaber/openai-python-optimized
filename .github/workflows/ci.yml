# Modified by Rasmus Faber for the independently maintained SDK fork.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  lint-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          # Match the Python target used by the repository's static checks.
          python-version: '3.10'
          enable-cache: true
      - uses: ./.github/actions/setup-node-tooling
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras python scripts/check-python-version-policy.py
      - run: ./scripts/lint
      - run: ./scripts/build
      - run: uv run --locked --all-extras python scripts/validate-release.py --dist dist
      - run: uv run --locked --all-extras python scripts/utils/validate-python-version-wheel.py
      - run: uv run --locked --all-extras python scripts/utils/validate-bedrock-wheel.py
      - run: uv run --locked --all-extras python scripts/utils/validate-httpx2-wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: ./.github/actions/setup-node-tooling
      - run: uv sync --locked --all-extras
      - run: ./scripts/test -n 4

  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Test transforms with Pydantic v2
        run: uv run --locked --all-extras --python "${{ matrix.python-version }}" pytest -n 0 tests/test_transform*.py
      - name: Test transforms with Pydantic v1
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: ./scripts/test-pydantic-v1 -n 0 tests/test_transform*.py
