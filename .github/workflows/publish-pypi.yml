# Modified by Rasmus Faber for the independently maintained SDK fork.
name: Publish PyPI
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'rasmusfaber/openai-python-optimized'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.metadata.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate package identity and release tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package=$(python scripts/validate-release.py --tag "$RELEASE_TAG")
          echo "package=$package" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.validate.outputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
